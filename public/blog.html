<!DOCTYPE html>

<head>

  <title>NanoConnect - Editorial Network</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --primary-accent: #3b82f6;
      --primary-accent-glow: rgba(59, 130, 246, 0.15);
      --bg-gradient: radial-gradient(120% 120% at 50% 0%, #fafafa 0%, #f1f5f9 100%);
    }

    .dark-mode {
      --primary-accent: #818cf8;
      --primary-accent-glow: rgba(129, 140, 248, 0.2);
      --bg-gradient: radial-gradient(120% 120% at 50% 0%, #030712 40%, #0b0f19 80%, #02040a 100%);
    }

    body {
      background: var(--bg-gradient);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      transition: background 0.5s ease;
    }

    .editorial-container { max-width: 680px; }

    .partner-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.03), 0 2px 8px -1px rgba(15, 23, 42, 0.02);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dark-mode .partner-card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .partner-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.1), 0 10px 20px -8px rgba(15, 23, 42, 0.05);
      border-color: var(--primary-accent);
    }

    .neon-halo {
      filter: blur(140px);
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body class="text-slate-800 dark:text-slate-200 min-h-screen font-sans transition-colors duration-500 relative pb-24">

  <div id="glow-halo" class="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-blue-500/10 rounded-full neon-halo"></div>

    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-xl">✍️</span>
        <span class="font-serif font-black tracking-tight text-lg text-slate-900 dark:text-white uppercase">NanoChronicles</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="toggleReaderMode()" class="w-9 h-9 flex items-center justify-center bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800 transition-all duration-300">
          <span id="theme-icon" class="text-sm">🌙</span>
        </button>
        <a href="/" class="text-xs font-bold text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">Dashboard ↗</a>
      </div>
    </div>
  </nav>

  <div class="max-w-md mx-auto mt-8 px-4">
    <div class="bg-white/40 dark:bg-slate-950/40 backdrop-blur-md border border-slate-200/50 dark:border-slate-850 p-2 rounded-2xl shadow-xl flex items-center justify-between gap-2">
      <span class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase pl-3 tracking-widest">Niche Selector:</span>
      <div class="flex gap-1">
        <button onclick="updateCategoryQuery('travel')" id="btn-cat-travel" class="text-xs px-3.5 py-2 font-bold rounded-xl transition-all duration-300 bg-slate-900 dark:bg-white text-white dark:text-slate-950">Travel</button>
        <button onclick="updateCategoryQuery('beauty')" id="btn-cat-beauty" class="text-xs px-3.5 py-2 font-bold rounded-xl transition-all duration-300 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900">Beauty</button>
        <button onclick="updateCategoryQuery('tech')" id="btn-cat-tech" class="text-xs px-3.5 py-2 font-bold rounded-xl transition-all duration-300 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900">Tech</button>
      </div>
    </div>
  </div>

  <main class="editorial-container mx-auto px-6 pt-16 space-y-12 relative">
    <div class="space-y-4">
      <div class="flex flex-wrap items-center gap-3 text-xs font-bold uppercase tracking-widest text-blue-500 dark:text-blue-400">
        <span id="article-badge" class="px-3 py-1 bg-blue-50 dark:bg-blue-950/40 border border-blue-200/50 dark:border-blue-900/50 rounded-full">TRAVEL</span>
        <span class="text-slate-300 dark:text-slate-700">•</span>
        <span class="text-slate-500 dark:text-slate-400">4 min read</span>
        <span class="text-slate-300 dark:text-slate-700">•</span>
        <span class="text-slate-500 dark:text-slate-400 font-mono">June 16, 2026</span>
      </div>
      <h1 id="article-title" class="font-serif font-black text-4xl md:text-5xl text-slate-900 dark:text-white leading-tight tracking-tight">The Best Guide To Modern Travel</h1>
      <div class="flex items-center gap-3 pt-2">
        <div class="w-10 h-10 bg-slate-200 dark:bg-slate-800 rounded-full flex items-center justify-center font-bold font-serif text-slate-600 dark:text-slate-400 border border-slate-300/40">NC</div>
        <div>
          <p class="text-xs font-bold text-slate-900 dark:text-white">Written by Nathan Carter</p>
          <p class="text-[10px] text-slate-500">Global Editor</p>
        </div>
      </div>
    </div>

    <article id="article-body" class="prose prose-slate dark:prose-invert max-w-none text-slate-600 dark:text-slate-300 leading-relaxed text-[15px] md:text-[16px] space-y-6"></article>

    <div class="space-y-6 pt-8 border-t border-slate-200/80 dark:border-slate-800/60">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-sm">💎</span>
          <h2 class="text-xs font-black uppercase tracking-widest text-slate-400 dark:text-slate-500">Sponsored Spotlights</h2>
        </div>
      </div>
      <div id="sponsored-spotlights-list" class="space-y-4">
        <p class="loading">Aligning sponsor parameters...</p>
      </div>
    </div>
  </main>

  <script>
    const CATEGORIES_MOCK = {
      travel: { badge: 'Travel Niche', color: '#3b82f6', accentGlow: 'rgba(59, 130, 246, 0.15)', glowColor: 'bg-blue-500/10', title: 'The Absolute Best Guide To Modern Travel In 2026', intro: 'Consumers are completely redefining how they approach their daily adventures.', body: ['Modern travelers prioritize high-durability modular gear.', 'Below, we look at the top community-voted recommendations.'] },
      beauty: { badge: 'Beauty & Skincare', color: '#ec4899', accentGlow: 'rgba(236, 72, 153, 0.15)', glowColor: 'bg-pink-500/10', title: 'Revitalizing Your Rituals: 2026 Skin Report', intro: 'Achieving a natural glow shouldn’t require a complex formula.', body: ['Top dermatologists emphasize clean formulas rich in organic botanicals.', 'Explore these highly coveted formulas designed for your regimen.'] },
      tech: { badge: 'Tech & Gear', color: '#06b6d4', accentGlow: 'rgba(6, 182, 212, 0.15)', glowColor: 'bg-cyan-500/10', title: 'Building The Ultimate Seamless Workspace', intro: 'Maximizing productivity is as much about your environment.', body: ['Minimalist equipment ensures you maintain a continuous creative flow.', 'Below are the accessories currently dominating professional workspaces.'] }
    };

    /*const CATEGORY_KEYWORDS_MAP = {
      travel: ['travel', 'boat', 'island', 'luggage'],
      beauty: ['beauty', 'serum', 'skincare', 'mask', 'glow'],
      tech: ['tech', 'keyboard', 'laptop', 'stand', 'mouse']
    }; */

    const CATEGORY_KEYWORDS_MAP = {
        travel: ['travel', 'boat', 'island', 'luggage'],
        // Add 'gel', 'moisturizer', 'hydration', 'acid' to the beauty array
        beauty: ['beauty', 'serum', 'skincare', 'mask', 'glow', 'gel', 'moisturizer', 'hydration', 'acid'], 
        tech: ['tech', 'keyboard', 'laptop', 'stand', 'mouse']
      };

    const urlParams = new URLSearchParams(window.location.search);
    let activeCategory = urlParams.get('category') || 'travel';
    if (!CATEGORIES_MOCK[activeCategory]) activeCategory = 'travel';

    function toggleReaderMode() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
    }

    function renderLayout() {
      const activeData = CATEGORIES_MOCK[activeCategory];
      
      document.documentElement.style.setProperty('--primary-accent', activeData.color);
      document.documentElement.style.setProperty('--primary-accent-glow', activeData.accentGlow);
      document.getElementById('glow-halo').className = `absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 rounded-full neon-halo ${activeData.glowColor}`;
      
      const badge = document.getElementById('article-badge');
      badge.textContent = activeData.badge;
      badge.style.color = activeData.color;
      badge.style.borderColor = activeData.color + '33';
      document.getElementById('article-title').textContent = activeData.title;
      
      const body = document.getElementById('article-body');
      body.innerHTML = `<p class="font-serif italic text-lg text-slate-500 dark:text-slate-400 leading-relaxed">${activeData.intro}</p>` + 
                       activeData.body.map(para => `<p>${para}</p>`).join('');

      ['travel', 'beauty', 'tech'].forEach(cat => {
        const btn = document.getElementById(`btn-cat-${cat}`);
        btn.className = (cat === activeCategory) 
          ? "text-xs px-3.5 py-2 font-bold rounded-xl transition-all duration-300 bg-slate-900 dark:bg-white text-white dark:text-slate-950 shadow-md"
          : "text-xs px-3.5 py-2 font-bold rounded-xl transition-all duration-300 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-900";
      });

      loadCampaignDeals();
    }

    function updateCategoryQuery(cat) {
      activeCategory = cat;
      const url = new URL(window.location);
      url.searchParams.set('category', cat);
      window.history.pushState({}, '', url);
      renderLayout();
    }

      try {

        const dbProducts = await res.ok ? await res.json() : [];

            </a>
          </div>
        `).join('');

    async function loadCampaignDeals() {
      const container = document.getElementById('sponsored-spotlights-list');
      container.innerHTML = '<p class="text-slate-500">Retrieving partners...</p>';
      
      try {
        const res = await fetch('/api/marketplace');
        const dbProducts = await res.ok ? await res.json() : [];
        
        // DEBUG: Log the data to the console to verify what you are receiving
        console.log("Fetched Products:", dbProducts);
        
        const keywords = CATEGORY_KEYWORDS_MAP[activeCategory];
        
        const products = dbProducts.filter(deal => {
          // 1. Keyword-based matching (using lowercase)
          const combinedText = `${deal.title || ''} ${deal.description || ''}`.toLowerCase();
          const hasKeyword = keywords.some(k => combinedText.includes(k.toLowerCase()));
          
          // 2. Optional: Category-based matching (If your DB has a 'category' field)
          // This ensures items explicitly marked as 'beauty' in the DB show up even if keywords don't match
          const hasCategoryMatch = deal.category && deal.category.toLowerCase() === activeCategory.toLowerCase();
          
          return hasKeyword || hasCategoryMatch;
        });

        // DEBUG: Log how many products passed the filter
        console.log("Filtered Products for", activeCategory, ":", products);

        if (products.length === 0) {
          container.innerHTML = `<p class="text-sm text-slate-500">No active ${activeCategory} deals right now.</p>`;
          return;
        }

        container.innerHTML = products.map(deal => `
          <div class="partner-card rounded-2xl p-6 flex flex-col md:flex-row justify-between gap-6">
            <div class="max-w-lg">
              <h3 class="font-bold text-slate-900 dark:text-white">${deal.title}</h3>
              <p class="text-xs text-slate-500 mt-1">${deal.description}</p>
            </div>
            <a href="/product.html?title=${encodeURIComponent(deal.title)}&price=${deal.price}" class="flex-shrink-0">
              <button class="px-5 py-3 rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-xs font-bold uppercase transition-all hover:opacity-90">Explore Deal ↗</button>
            </a>
          </div>
        `).join('');
        
      } catch (e) {
        console.error("Error loading deals:", e);
        container.innerHTML = '<p class="text-rose-400">Failed to align network partners.</p>';
      }
    }      

    renderLayout();
  </script>
</body>
</html>
