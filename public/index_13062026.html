<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NanoConnect - Creator Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 22px; font-weight: 700; }
    header p { font-size: 13px; opacity: 0.85; }

    .nav {
      background: white;
      display: flex;
      border-bottom: 2px solid #e2e8f0;
    }

    .nav a {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: #64748b;
      cursor: pointer;
    }

    .nav a.active {
      color: #2563eb;
      border-bottom: 3px solid #2563eb;
    }

    /* Sub-navigation style for toggling view feeds inside Creator View */
    .view-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .view-toggle button {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .container { max-width: 480px; margin: 0 auto; padding: 20px 16px; }

    h2 { font-size: 18px; color: #1e293b; margin-bottom: 16px; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .card h3 { font-size: 17px; color: #1e293b; margin-bottom: 6px; }
    .card p { font-size: 13px; color: #64748b; margin-bottom: 14px; }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .payout { color: #16a34a; font-weight: 700; font-size: 16px; }

    .hashtag {
      background: #eff6ff;
      color: #2563eb;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 10px;
      outline: none;
      transition: border 0.2s;
    }

    input[type="text"]:focus { border-color: #2563eb; }

    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }

    .btn-logout {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      width: auto;
      margin-top: 4px;
      margin-bottom: 0;
      transition: background 0.2s;
    }
    .btn-logout:hover { background: rgba(255, 255, 255, 0.15); }

    .message {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .message.success { background: #dcfce7; color: #166534; display: block; }
    .message.error { background: #fee2e2; color: #991b1b; display: block; }

    .submissions { margin-top: 30px; }

    .sub-item {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sub-item .title { font-size: 14px; font-weight: 600; color: #1e293b; }
    .sub-item .date { font-size: 12px; color: #94a3b8; margin-top: 2px; }

    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge.approved { background: #dcfce7; color: #166534; }
    .badge.pending { background: #fef9c3; color: #854d0e; }
    .badge.rejected { background: #fee2e2; color: #991b1b; }

    .loading { text-align: center; color: #94a3b8; font-size: 14px; padding: 20px; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🔗 NanoConnect</h1>
      <p>Creator Dashboard</p>
    </div>
    <div style="text-align:right">
      <p style="font-weight:600" id="header-handle">@Loading...</p>
      <p style="font-size:12px; opacity:0.7" id="header-id">ID: --</p>
      <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
    </div>
  </header>

  <div class="nav">
    <a href="/" class="active">👤 Creator View</a>
    <a href="/brand.html">🏷️ Brand View</a>
  </div>

  <div class="container">

    <div class="view-toggle">
      <button id="tab-campaigns" onclick="switchTab('campaigns')" style="background: #2563eb; color: white;">🎯 Direct Campaigns</button>
      <button id="tab-marketplace" onclick="switchTab('marketplace')" style="background: #e2e8f0; color: #475569;">🛒 Affiliate Marketplace</button>
    </div>

    <div id="section-campaigns">
      <h2>📢 Active Campaigns</h2>
      <div id="campaigns">
        <p class="loading">Loading campaigns...</p>
      </div>

      <div class="submissions">
        <h2>📋 My Submissions</h2>
        <div id="submissions">
          <p class="loading">Loading submissions...</p>
        </div>
      </div>
    </div>

    <div id="section-marketplace" style="display: none;">
      <h2>🛒 Product Marketplace</h2>
      <div id="marketplace-list" style="display: grid; grid-template-columns: 1fr; gap: 16px;">
        <p class="loading">Loading marketplace products...</p>
      </div>
    </div>

    <div id="message" class="message"></div>

  </div>
  
  <script>
    // ── Handle Authenticated Session Guard ───────────────────
    const token = localStorage.getItem('token');
    const userSession = JSON.parse(localStorage.getItem('user'));

    if (!token || !userSession) {
      window.location.href = '/auth.html';
    }

    const CREATOR_ID = userSession.id;
    const TWITTER_HANDLE = userSession.twitter_handle || 'Unknown';

    document.getElementById('header-handle').textContent = `@${TWITTER_HANDLE}`;
    document.getElementById('header-id').textContent = `ID: ${CREATOR_ID}`;

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/auth.html';
    }

    // ── Feed View Navigation Switcher ──────────────────────────
    function switchTab(target) {
      const campBtn = document.getElementById('tab-campaigns');
      const marketBtn = document.getElementById('tab-marketplace');
      const campSection = document.getElementById('section-campaigns');
      const marketSection = document.getElementById('section-marketplace');

      if (target === 'campaigns') {
        campSection.style.display = 'block';
        marketSection.style.display = 'none';
        campBtn.style.cssText = 'background: #2563eb; color: white;';
        marketBtn.style.cssText = 'background: #e2e8f0; color: #475569;';
      } else {
        campSection.style.display = 'none';
        marketSection.style.display = 'block';
        campBtn.style.cssText = 'background: #e2e8f0; color: #475569;';
        marketBtn.style.cssText = 'background: #2563eb; color: white;';
        loadMarketplaceProducts();
      }
    }

    // ── Live Stream Ad-Click Notifications (SSE Connection) ───────────
    function initializeNotificationStream() {
      const eventSource = new EventSource('/api/notifications/stream');

      eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.type === 'AD_CLICK') {
          showLiveNotificationToast(data.title, data.message);
        }
      };

      eventSource.onerror = function() {
        console.log("Real-time stream disconnected. Reconnecting automatically...");
      };
    }

    // ── Check URL for Ad Redirects ──────────────────────────────
    function checkForLandingNotification() {
      const urlParams = new URLSearchParams(window.location.search);
      
      if (urlParams.get('clicked') === 'true') {
        const title = urlParams.get('campaignTitle') || 'Your Active Ad';
        
        showLiveNotificationToast(
          '🔥 New Ad Click!', 
          `Someone just clicked your link for "${title}" on the travel blog!`
        );

        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    // Toast UI Generator Engine
    function showLiveNotificationToast(title, message) {
      let toastContainer = document.getElementById('toast-container');
      if (!toastContainer) {
        toastContainer = document.createElement('div');
        toastContainer.id = 'toast-container';
        toastContainer.style.cssText = 'position:fixed; bottom:20px; right:20px; z-index:9999; max-width:340px; width:calc(100% - 40px);';
        document.body.appendChild(toastContainer);
      }

      const toast = document.createElement('div');
      toast.style.cssText = `
        background: #0f172a;
        color: white;
        padding: 16px;
        border-radius: 14px;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        margin-top: 12px;
        transform: translateY(30px);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        border-left: 4px solid #38bdf8;
      `;

      toast.innerHTML = `
        <div style="font-weight:700; font-size:14px; color:#38bdf8; margin-bottom:4px;">${title}</div>
        <div style="font-size:12px; color:#cbd5e1; line-height:1.4;">${message}</div>
      `;

      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.style.transform = 'translateY(0)';
        toast.style.opacity = '1';
      }, 50);

      setTimeout(() => {
        toast.style.transform = 'translateY(-20px)';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 400);
      }, 5000);
    }

    // ── Load Campaigns ──────────────────────────────
    async function loadCampaigns() {
      try {
        const res = await fetch('/api/campaigns', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const campaigns = await res.json();
        const container = document.getElementById('campaigns');

        if (!campaigns.length) {
          container.innerHTML = '<p class="loading">No active campaigns yet.</p>';
          return;
        }

        const unique = campaigns.filter((c, i, arr) => arr.findIndex(x => x.id === c.id) === i);

        container.innerHTML = unique.map(camp => `
          <div class="card">
            <h3>${camp.title}</h3>
            <p>${camp.description}</p>
            <div class="meta">
              <span class="payout">₹${camp.payout_per_post} per post</span>
              <span class="hashtag">${camp.required_hashtag}</span>
            </div>
            <input type="text" id="url-${camp.id}" placeholder="Paste your X post URL here..." />
            <button onclick="submitPost(${camp.id})" id="btn-${camp.id}">Submit Proof</button>
          </div>
        `).join('');

      } catch (err) {
        document.getElementById('campaigns').innerHTML =
          '<p class="loading">Failed to load campaigns. Is your server running?</p>';
      }
    }

    // ── Load Marketplace Products ───────────────────────────
    async function loadMarketplaceProducts() {
      const container = document.getElementById('marketplace-list');
      container.innerHTML = '<p class="loading">Loading products...</p>';
      
      try {
        const res = await fetch('/api/marketplace', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const products = await res.json();
        
        if (!products.length) {
          container.innerHTML = '<p class="loading">No products listed in marketplace yet.</p>';
          return;
        }
        
        container.innerHTML = products.map(product => {
          const uniqueAffiliateUrl = `${window.location.origin}/r/${product.id}/${CREATOR_ID}`;
          const tweetIntent = `https://twitter.com/intent/tweet?text=${encodeURIComponent(
            `Checking out this amazing ${product.title}! Get yours here: ${uniqueAffiliateUrl} #nanotest`
          )}`;

          return `
            <div class="card" style="display: flex; flex-direction: column; gap: 12px; padding: 16px;">
              <div style="display: flex; gap: 16px;">
                ${product.image_url ? `<img src="${product.image_url}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;" />` : ''}
                <div style="flex: 1;">
                  <h4 style="font-size: 16px; color: #1e293b; margin-bottom: 4px;">${product.title}</h4>
                  <p style="font-size: 13px; color: #64748b; margin-bottom: 6px;">${product.description}</p>
                  <div style="font-weight: 700; color: #1e293b;">₹${product.price}</div>
                </div>
              </div>
              
              <div style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center;">
                <span style="color: #16a34a; font-weight: 700;">💰 Earn ${product.commission_percentage}% per sale</span>
                <span style="color: #2563eb; font-weight: 600; background: #eff6ff; padding: 2px 8px; border-radius: 12px;">#nanotest</span>
              </div>

              <div style="display: flex; gap: 8px; margin-top: 4px;">
                <button onclick="navigator.clipboard.writeText('${uniqueAffiliateUrl}'); alert('Custom link copied!')" style="background: #f1f5f9; color: #1e293b; flex: 1; padding: 10px; font-size:13px; margin-bottom: 0;">
                  📋 Copy Link
                </button>
                <a href="${tweetIntent}" target="_blank" style="display: block; background: #0f172a; color: white; text-decoration: none; border-radius: 10px; padding: 12px; text-align: center; font-weight: 600; font-size: 13px; flex: 2;">
                  🐦 Post on X
                </a>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = '<p class="loading">Failed to load marketplace products.</p>';
      }
    }

    // ── Submit Post ─────────────────────────────────
    async function submitPost(campaignId) {
      const urlInput = document.getElementById(`url-${campaignId}`);
      const btn = document.getElementById(`btn-${campaignId}`);
      const postUrl = urlInput.value.trim();

      if (!postUrl) {
        showMessage('Please paste your X post URL first!', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Verifying...';
      document.getElementById('message').className = 'message';

      try {
        const res = await fetch('/api/submissions', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            creator_id: CREATOR_ID,
            campaign_id: campaignId,
            post_url: postUrl
          })
        });

        const data = await res.json();

        if (res.ok) {
          showMessage(`✅ Post Verified! Your payout: ₹${data.payout_amount}`, 'success');
          urlInput.value = '';
          loadSubmissions();
        } else {
          showMessage(`❌ ${data.error}`, 'error');
        }
      } catch (err) {
        showMessage('❌ Could not reach server. Is it running?', 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Submit Proof';
    }

    // ── Load Submissions ────────────────────────────
    async function loadSubmissions() {
      try {
        const res = await fetch(`/api/submissions/${CREATOR_ID}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const subs = await res.json();
        const container = document.getElementById('submissions');

        if (!subs.length) {
          container.innerHTML = '<p class="loading">No submissions yet.</p>';
          return;
        }

        container.innerHTML = subs.map(sub => `
          <div class="sub-item">
            <div>
              <div class="title">${sub.campaign_title}</div>
              <div class="date">₹${sub.payout_amount} • ${new Date(sub.submitted_at).toLocaleDateString()}</div>
            </div>
            <span class="badge ${sub.status}">${sub.status}</span>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('submissions').innerHTML =
          '<p class="loading">Failed to load submissions.</p>';
      }
    }

    function showMessage(text, type) {
      const msgBox = document.getElementById('message');
      msgBox.textContent = text;
      msgBox.className = `message ${type}`;
    }

    // ── Initialization Framework Execution ───────────
    loadCampaigns();
    loadSubmissions();
    initializeNotificationStream(); 
    checkForLandingNotification();
  </script>

</body>
</html>
