<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NanoConnect - Brand Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    header {
      background: #7c3aed;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 22px; font-weight: 700; }
    header p { font-size: 13px; opacity: 0.85; }

    .nav {
      background: white;
      display: flex;
      border-bottom: 2px solid #e2e8f0;
    }

    .nav a {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: #64748b;
    }

    .nav a.active { color: #7c3aed; border-bottom: 3px solid #7c3aed; }

    .container { max-width: 520px; margin: 0 auto; padding: 20px 16px; }

    h2 { font-size: 18px; color: #1e293b; margin-bottom: 16px; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
      font-family: inherit;
    }

    input:focus, textarea:focus { border-color: #7c3aed; }

    textarea { resize: vertical; min-height: 80px; }

    button {
      width: 100%;
      background: #7c3aed;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }

    button:hover { background: #6d28d9; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }

    .message {
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      display: none;
      margin-bottom: 16px;
    }

    .message.success { background: #f3e8ff; color: #6d28d9; display: block; }
    .message.error { background: #fee2e2; color: #991b1b; display: block; }

    .campaign-item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .campaign-item h4 { font-size: 15px; color: #1e293b; margin-bottom: 4px; }
    .campaign-item p { font-size: 13px; color: #64748b; margin-bottom: 10px; }

    .campaign-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .payout { color: #16a34a; font-weight: 700; font-size: 15px; }

    .hashtag {
      background: #f3e8ff;
      color: #7c3aed;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .sub-count {
      font-size: 12px;
      color: #94a3b8;
    }

    .loading { text-align: center; color: #94a3b8; font-size: 14px; padding: 20px; }

    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🏷️ NanoConnect</h1>
      <p>Brand Dashboard</p>
    </div>
    <div style="text-align:right">
      <p style="font-weight:600">Brand Admin</p>
      <p style="font-size:12px; opacity:0.7">ID: 1</p>
    </div>
  </header>

  <div class="nav">
    <a href="/">👤 Creator View</a>
    <a href="/brand.html" class="active">🏷️ Brand View</a>
  </div>

  <div class="container">

    <!-- Create Campaign Form -->
    <h2>➕ Create New Campaign</h2>
    <div class="card">
      <div id="form-message" class="message"></div>

      <div class="form-group">
        <label>Campaign Title</label>
        <input type="text" id="title" placeholder="e.g. Thai Jasmine Rice Serum" />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea id="description" placeholder="Tell influencers what to promote..."></textarea>
      </div>

      <div class="form-group">
        <label>Product URL</label>
        <input type="text" id="product_url" placeholder="https://yourstore.com/product" />
        <p class="hint">The link influencers will include in their post</p>
      </div>

      <div class="form-group">
        <label>Required Hashtag</label>
        <input type="text" id="required_hashtag" placeholder="#nanotest" />
        <p class="hint">Influencers must include this in their post</p>
      </div>

      <div class="form-group">
        <label>Payout Per Post (₹)</label>
        <input type="number" id="payout_per_post" placeholder="500" min="1" />
        <p class="hint">Creator gets 80% (₹400), app keeps 20% (₹100)</p>
      </div>

      <button onclick="createCampaign()" id="create-btn">🚀 Launch Campaign</button>
    </div>

    <!-- Active Campaigns List -->
    <h2>📋 Your Campaigns</h2>
    <div id="campaigns-list">
      <p class="loading">Loading campaigns...</p>
    </div>

  </div>

  <script>
    const BRAND_ID = 1;

    // ── Create Campaign ─────────────────────────────
    async function createCampaign() {
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();
      const product_url = document.getElementById('product_url').value.trim();
      const required_hashtag = document.getElementById('required_hashtag').value.trim();
      const payout_per_post = parseFloat(document.getElementById('payout_per_post').value);

      // Basic validation
      if (!title || !description || !product_url || !required_hashtag || !payout_per_post) {
        showFormMessage('Please fill in all fields!', 'error');
        return;
      }

      if (payout_per_post < 1) {
        showFormMessage('Payout must be at least ₹1', 'error');
        return;
      }

      const btn = document.getElementById('create-btn');
      btn.disabled = true;
      btn.textContent = 'Launching...';

      try {
        const res = await fetch('/api/campaigns', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            brand_id: BRAND_ID,
            title,
            description,
            product_url,
            required_hashtag,
            payout_per_post
          })
        });

        const data = await res.json();

        if (res.ok) {
          showFormMessage(`✅ Campaign "${title}" launched successfully!`, 'success');
          clearForm();
          loadCampaigns();
        } else {
          showFormMessage(`❌ ${data.error}`, 'error');
        }
      } catch (err) {
        showFormMessage('❌ Could not reach server.', 'error');
      }

      btn.disabled = false;
      btn.textContent = '🚀 Launch Campaign';
    }

    // ── Load Campaigns ──────────────────────────────
    async function loadCampaigns() {
      try {
        const res = await fetch('/api/campaigns');
        const campaigns = await res.json();
        const container = document.getElementById('campaigns-list');

        if (!campaigns.length) {
          container.innerHTML = '<p class="loading">No campaigns yet. Create one above!</p>';
          return;
        }

        container.innerHTML = campaigns.map(camp => `
          <div class="campaign-item">
            <h4>${camp.title}</h4>
            <p>${camp.description}</p>
            <div class="campaign-meta">
              <span class="payout">₹${camp.payout_per_post} per post</span>
              <span class="hashtag">${camp.required_hashtag}</span>
              <span class="sub-count">🔗 ${camp.product_url.substring(0, 30)}...</span>
            </div>
          </div>
        `).join('');

      } catch (err) {
        document.getElementById('campaigns-list').innerHTML =
          '<p class="loading">Failed to load campaigns.</p>';
      }
    }

    // ── Helpers ─────────────────────────────────────
    function clearForm() {
      ['title', 'description', 'product_url', 'required_hashtag', 'payout_per_post']
        .forEach(id => document.getElementById(id).value = '');
    }

    function showFormMessage(text, type) {
      const msg = document.getElementById('form-message');
      msg.textContent = text;
      msg.className = `message ${type}`;
      setTimeout(() => { msg.className = 'message'; }, 4000);
    }

    // ── Init ────────────────────────────────────────
    loadCampaigns();
  </script>

</body>
</html>
