<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NanoConnect - Premium Creator Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <style>
    body { background: radial-gradient(125% 125% at 50% 10%, #020617 40%, #0f172a 100%); }
    .glass-card { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body class="text-slate-100 min-height-screen font-sans">

  <header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-6 py-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-black tracking-tight bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-2">🔗 NanoConnect</h1>
    </div>
    <button class="bg-slate-900 border border-slate-800 px-4 py-2 text-xs font-bold rounded-lg" onclick="handleLogout()">Sign Out</button>
  </header>

  <main class="max-w-xl mx-auto px-4 py-8">
    
    <!-- User Identity Section -->
    <div id="user-display" class="mb-8 p-4 glass-card rounded-xl border-l-4 border-sky-500">
      <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Authenticated Creator</p>
      <div id="twitter-handle-text" class="text-lg font-black text-white">Loading...</div>
    </div>

    <div id="section-campaigns" class="space-y-6">
      <div class="submissions pt-6">
        <div class="flex items-center gap-2 text-slate-400 text-xs font-bold uppercase tracking-wider mb-4">
          <span>📋</span> Unified Verification Logs
        </div>
        <div id="submissions" class="space-y-3">
          <p class="loading text-slate-500">Compiling all records...</p>
        </div>
      </div>
    </div>
  </main>
  
  <script>
    // Safe redirect helper
    function redirectToAuth() {
      const authUrl = '/auth.html';
      if (window.location.pathname !== authUrl) {
        window.location.assign(authUrl);
      }
    }

    const token = localStorage.getItem('token');
    const userSession = JSON.parse(localStorage.getItem('user'));
    
    // Check auth state securely
    if (!token || !userSession) {
      redirectToAuth();
    }
    
    const CREATOR_ID = userSession ? (userSession.id || 1) : null;

    // Initialize UI Identity
    const twitterHandleElement = document.getElementById('twitter-handle-text');
    if (twitterHandleElement && userSession) {
      const TWITTER_HANDLE = userSession.twitter_handle || userSession.username || `creator_${CREATOR_ID}`;
      // Clean and display the handle
      twitterHandleElement.textContent = `@${TWITTER_HANDLE.replace('@', '')}`;
    }

    async function loadSubmissions() {
      const container = document.getElementById('submissions');
      if (!CREATOR_ID) return;

      let allLogs = [];

      // 1. Fetch API Submission Logs
      try {
        const res = await fetch(`/api/submissions/${CREATOR_ID}`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (res.ok) {
          const subs = await res.json();
          allLogs = subs.map(s => ({
            title: s.campaign_title,
            amount: s.payout_amount,
            date: new Date(s.submitted_at).toLocaleDateString(),
            status: s.status
          }));
        }
      } catch (err) { console.error("API Fetch failed"); }

      // 2. Merge with LocalStorage Proof Logs
      try {
        const localLogs = JSON.parse(localStorage.getItem('proof_logs') || '[]');
        const formattedLocal = localLogs.map(l => ({
          title: l.title,
          amount: l.price,
          date: l.date,
          status: l.status
        }));
        allLogs = [...allLogs, ...formattedLocal];
      } catch(e) { console.error("Error reading local logs"); }

      if (!allLogs.length) {
        container.innerHTML = '<p class="text-slate-500 text-xs">No records found.</p>';
        return;
      }

      container.innerHTML = allLogs.map(log => `
        <div class="glass-card rounded-xl p-4 flex justify-between items-center">
          <div>
            <div class="text-sm font-bold text-slate-200">${log.title}</div>
            <div class="text-[11px] text-slate-500 font-semibold mt-0.5">Value: ${log.amount} • ${log.date}</div>
          </div>
          <span class="px-3 py-1 text-[10px] font-extrabold rounded-full ${log.status === 'approved' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">${log.status}</span>
        </div>
      `).join('');
    }

    function handleLogout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      redirectToAuth();
    }

    loadSubmissions();
  </script>
</body>
</html>
